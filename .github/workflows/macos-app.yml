name: macos-app

# Builds the Mac app and its disk image on a GitHub-hosted Apple silicon runner, then checks
# them. The signature is ad hoc: nothing here holds a secret, signs with a Developer ID or
# notarizes. See macos/README.md.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "macos/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/macos-app.yml"
  workflow_dispatch:

permissions:
  contents: read

# GitHub-hosted runners only, and every action pinned by full commit SHA
# (tools/guards/workflow_lint.py fails the build otherwise).

jobs:
  app:
    name: build and check the app (macos-15, arm64)
    runs-on: macos-15
    # Each step that could hang has a limit of its own, well inside this one, so a hang fails that
    # step and the screenshots are still uploaded at the end.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          python-version: "3.13"
          enable-cache: false
      - name: Show the machine and the tools
        run: |
          sw_vers
          uname -m
          xcrun swiftc --version
          uv --version
      - name: Check the pins (plan)
        run: uv run --no-project python macos/build_app.py plan
      - name: Build the app and the disk image
        run: uv run --no-project python macos/build_app.py build
      - name: "Check: the embedded interpreter runs the host"
        if: ${{ !cancelled() }}
        run: uv run --no-project python macos/check_app.py host
      - name: "Probe: the host's status, pair and run verbs as the app will run them (printed only)"
        if: ${{ !cancelled() }}
        run: uv run --no-project python macos/check_app.py probe
      - name: "Check: the app's Swift code against the real command line"
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        run: uv run --no-project python macos/check_app.py swift
      - name: "Check: a copy in another folder still works"
        if: ${{ !cancelled() }}
        timeout-minutes: 14
        run: uv run --no-project python macos/check_app.py relocate
      - name: "Check: libraries, paths, minimum macOS, and what the app imports"
        if: ${{ !cancelled() }}
        run: uv run --no-project python macos/check_app.py links
      - name: "Check: the signature (after the runs above, so nothing was written)"
        if: ${{ !cancelled() }}
        run: uv run --no-project python macos/check_app.py signature
      - name: "Check: the app launches and keeps running"
        if: ${{ !cancelled() }}
        run: uv run --no-project python macos/check_app.py launch
      - name: "Check: the menu, driven as a user would"
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: uv run --no-project python macos/check_app.py ui --require-driven
      - name: "Gatekeeper's verdict (printed only; ad hoc builds are refused)"
        if: ${{ !cancelled() }}
        run: uv run --no-project python macos/check_app.py gatekeeper
      - name: "Check: the disk image"
        if: ${{ !cancelled() }}
        run: uv run --no-project python macos/check_app.py dmg
      - name: "Check: the host's test suite passes on the pruned runtime"
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          copy="$RUNNER_TEMP/pruned/Capsule.app"
          mkdir -p "$RUNNER_TEMP/pruned"
          ditto "build/macos/Capsule.app" "$copy"
          python="$copy/Contents/Resources/python/bin/python3"
          export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/pruned-venv"
          uv venv --python "$python" "$UV_PROJECT_ENVIRONMENT"
          uv sync --locked --extra conformance --python "$UV_PROJECT_ENVIRONMENT/bin/python"
          uv run --no-sync python -c "import sys; print(sys.version); print(sys.base_prefix)"
          uv run --no-sync python -c "import sys; assert 'Capsule.app' in sys.base_prefix"
          uv run --no-sync pytest -q
      # Pairs the app's own profile with a local hub and a fake Lucille, then drives the app through
      # the pairing window, `run`'s supervision, Quit and Disconnect. It needs Switchboard's hub and
      # the test harness, so it runs in the environment the step above made from the app's own
      # interpreter. Its own time limit keeps a hang from using up the job's, which would cancel the
      # screenshot upload below.
      - name: "Check: pairing and run, end to end, with a local hub and a fake Lucille"
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/pruned-venv
        run: uv run --no-sync python macos/check_app.py pairing --require-driven
      # Only from a run started by hand (workflow_dispatch), and only when every check passed: a push
      # or a pull request uploads no disk image. An artifact of a manual run of this public
      # repository can still be downloaded by any signed-in GitHub user while it is kept, so it is
      # kept for 3 days. A pull request from a fork runs the fork's own copy of this file, which can
      # upload anything: an artifact on that run is the fork's build, whatever its name. The
      # artifact's name says which event and which commit built it, and the file name ends
      # "-adhoc-macOS-arm64.dmg", so it cannot be taken for a release asset.
      - name: Upload the disk image (ad hoc signed, not a release)
        if: ${{ success() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capsule-adhoc-macos-arm64-dmg-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/macos/*-adhoc-macOS-arm64.dmg
          if-no-files-found: error
          retention-days: 3
      - name: Upload the screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capsule-macos-screenshots
          path: build/macos/check/screens/*.png
          if-no-files-found: warn
          retention-days: 7
