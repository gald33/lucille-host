name: python-next

# The suite on the next Python the host may run on, 3.14, before it joins ci.yml's matrix. It gates
# nothing: it is a workflow of its own, so ci.yml's rule that every job fails the run when it fails
# (decisions/0002 §18) still holds there. It moves into ci.yml's test matrix once it has passed on
# a few pushes to main, as the xcode-27 leg did. Until then a failure here is a note, and the
# reviewer of a pull request reads it as one.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-next-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# GitHub-hosted runners only, and every action pinned by full commit SHA
# (tools/guards/workflow_lint.py fails the build otherwise).

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }}, advisory)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Install from the lock, with the conformance extra
        run: uv sync --locked --extra conformance
      - name: Show the interpreter
        run: uv run --no-sync python -VV
      - name: Test
        run: uv run --no-sync pytest -q
